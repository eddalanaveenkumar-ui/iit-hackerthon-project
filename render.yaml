# Render blueprint — deploys the LearnMate AI API as a Docker web service.
#
# It builds from server/Dockerfile so the image contains BOTH runtimes the app
# needs: Node for the API, Python for executing student submissions.
#
# Usage: push this file, then in Render choose
#   New → Blueprint → connect this repository → Apply.
# Render reads this file and creates the service below.
#
# Set the secret env vars marked `sync: false` in the Render dashboard
# (JWT_SECRET, SECRET_ENCRYPTION_KEY, MONGODB_URI, CORS_ORIGINS).
services:
  - type: web
    name: learnmate-api
    # `runtime: docker` rather than `runtime: node`.
    #
    # The API executes student code, and Python submissions need a real Python
    # interpreter in the image. `runtime: node` is Node-only, so `spawn python3`
    # failed with ENOENT and every Python answer was graded wrong without ever
    # running. server/Dockerfile installs python3 alongside Node.
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_MODE
        value: external
      - key: DB_NAME
        value: learnmate
      # Set in the Render dashboard — never committed.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      # Your Vercel URL, so the browser is allowed to call this API.
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "true"
      # Optional — add later from the admin AI console instead.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
